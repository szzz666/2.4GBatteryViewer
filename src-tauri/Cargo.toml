[package]
name = "battery-viewer"
version = "0.1.0"
description = "2.4G 外设电量监视器"
default-run = "battery-viewer"
authors = ["zhouy"]
edition = "2021"

[lib]
name = "battery_viewer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hidapi = { version = "2.6", features = ["windows-native"] }
parking_lot = "0.12"


[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
